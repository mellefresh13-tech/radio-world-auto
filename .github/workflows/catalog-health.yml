name: Catalog health check

on:
  workflow_dispatch:
    inputs:
      query:
        description: "Station id, name, alias, city or other searchable text"
        required: true
        type: string
      check_streams:
        description: "Probe matched stream URLs from the GitHub runner"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check published catalog
        run: |
          python tools/check_catalog.py \
            --query "${{ inputs.query }}" \
            ${{ inputs.check_streams && '--check-streams' || '' }}
