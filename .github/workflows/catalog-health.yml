name: Catalog health check

on:
  workflow_dispatch:
    inputs:
      query:
        description: "Station id, name, alias, city or other searchable text"
        required: true
        type: string
      check_streams:
        description: "Probe matched stream URLs from the GitHub runner"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stream-check dependency
        if: ${{ inputs.check_streams }}
        run: python -m pip install "httpx>=0.27,<1" "dnspython>=2.6,<3"

      - name: Check published catalog
        env:
          QUERY: ${{ inputs.query }}
          CHECK_STREAMS: ${{ inputs.check_streams }}
        run: |
          if [[ "$CHECK_STREAMS" == "true" ]]; then
            python tools/check_catalog.py --query "$QUERY" --check-streams
          else
            python tools/check_catalog.py --query "$QUERY"
          fi
