name: Production API smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "47 */6 * * *"
  push:
    paths:
      - "api/**"
      - ".github/workflows/production-smoke.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Check health
        run: |
          set -eu
          response="$(curl --fail --silent --show-error --max-time 20             https://radio-world-auto-production.up.railway.app/health)"
          echo "$response"
          python -c 'import json,sys; d=json.load(sys.stdin); assert d["status"]=="ok"; assert d["stations"] > 0; assert d["online_streams"] > 0' <<< "$response"

      - name: Check countries
        run: |
          set -eu
          curl --fail --silent --show-error --max-time 20             https://radio-world-auto-production.up.railway.app/countries             | python -c 'import json,sys; d=json.load(sys.stdin); assert isinstance(d,list) and len(d)>0'

      - name: Check genres
        run: |
          set -eu
          curl --fail --silent --show-error --max-time 20             https://radio-world-auto-production.up.railway.app/genres             | python -c 'import json,sys; d=json.load(sys.stdin); assert isinstance(d,list) and len(d)>0'

      - name: Check station search
        run: |
          set -eu
          curl --fail --silent --show-error --max-time 20             'https://radio-world-auto-production.up.railway.app/stations?limit=3'             | python -c 'import json,sys; d=json.load(sys.stdin); assert isinstance(d["stations"],list) and len(d["stations"])>0; assert d["total"]>0'

      - name: Check station stream contract
        run: |
          set -eu
          curl --fail --silent --show-error --max-time 20             'https://radio-world-auto-production.up.railway.app/stations?limit=1'             | python -c 'import json,sys; p=json.load(sys.stdin); s=p["stations"][0]; assert s["id"]; assert s["name"]; assert s["country"]; assert s["streams"]; assert s["streams"][0]["url"].startswith(("http://","https://"))'
