name: API and catalog metadata tests

on:
  push:
    branches:
      - main
      - "refactor/**"
    paths:
      - "api/**"
      - "tools/build_catalog_delta.py"
      - "tools/tests/**"
      - ".github/workflows/api-tests.yml"
  pull_request:
  workflow_dispatch:

concurrency:
  group: api-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: API and catalog metadata tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            api/requirements-dev.txt
      - name: Install API dependencies
        run: pip install -r api/requirements.txt -r api/requirements-dev.txt
      - name: Run API and catalog metadata tests
        env:
          PYTHONPATH: api/src
        run: python -m pytest api/tests tools/tests
