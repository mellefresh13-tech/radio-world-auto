name: API and catalog metadata tests

on:
  push:
    branches:
      - main
      - "refactor/**"
    paths:
      - "api/**"
      - "tools/build_catalog_delta.py"
      - "tools/tests/**"
      - ".github/workflows/api-tests.yml"
  pull_request:
    paths:
      - "api/**"
      - "tools/build_catalog_delta.py"
      - "tools/tests/**"
      - ".github/workflows/api-tests.yml"
  workflow_dispatch:

concurrency:
  group: api-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - name: Install API dependencies
        run: pip install -r api/requirements.txt
      - name: Run API and catalog metadata tests
        run: python -m pytest api/tests tools/tests
