name: Settings branch checks

on:
  push:
    branches:
      - "feature/settings-screen-2026-10-19"
    paths:
      - "android/**"
      - "docs/**"
      - ".github/workflows/settings-branch-checks.yml"
  pull_request:
    branches:
      - "feature/settings-screen-2026-10-19"
    paths:
      - "android/**"
      - "docs/**"
      - ".github/workflows/settings-branch-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: settings-branch-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-checks:
    name: Unit tests and lint (no APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Run Android unit tests
        run: gradle :app:test

      - name: Run Android lint
        run: gradle :app:lintRelease

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: settings-branch-lint-report
          path: android/app/build/reports/lint-results-release.*
          if-no-files-found: warn
