name: Settings branch checks

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: settings-branch-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-checks:
    name: Unit tests and lint (no APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: "9.6.0"

      - name: Run Android unit tests
        run: gradle :app:test

      - name: Run Android lint
        run: gradle :app:lintRelease

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: settings-branch-lint-report
          path: android/app/build/reports/lint-results-release.*
          if-no-files-found: warn
