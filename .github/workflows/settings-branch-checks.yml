name: Settings branch checks

on:
  push:
    branches:
      - "feature/settings-screen-2026-10-19"
    paths:
      - "android/**"
      - "docs/**"
      - ".github/workflows/settings-branch-checks.yml"
  pull_request:
    branches:
      - "feature/settings-screen-2026-10-19"
    paths:
      - "android/**"
      - "docs/**"
      - ".github/workflows/settings-branch-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: settings-branch-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-checks:
    name: Unit tests and lint (no APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: "9.6.0"

      - name: Run Android unit tests
        run: gradle :app:test

      - name: Run Android lint
        run: gradle :app:lintRelease

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: settings-branch-lint-report
          path: android/app/build/reports/lint-results-release.*
          if-no-files-found: warn
