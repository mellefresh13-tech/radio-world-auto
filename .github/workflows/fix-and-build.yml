name: One-time metadata fix and release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix metadata handling
        shell: bash
        run: python -c "import base64; exec(base64.b64decode(''))"

      - name: Commit source fix and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-and-build.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/src/main/java/com/mellefresh13/radio/MainActivity.kt .github/workflows/fix-and-build.yml
          git commit -m "Fix artist and title metadata handling"
          git push origin HEAD:main

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build release APK
        working-directory: android
        run: gradle :app:assembleRelease -PradioApiUrl=https://radio-world-auto-production.up.railway.app/

      - name: Generate temporary release key
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/radio-world-auto-release.jks" \
            -storepass "temporary-release-password" \
            -keypass "temporary-release-password" \
            -alias radio-world-auto \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Radio World Auto, OU=Mobile, O=mellefresh13-tech, L=, ST=, C=BY"

      - name: Align and sign release APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -name zipalign | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
          test -f "$APK"
          "$ZIPALIGN" -f -p 4 "$APK" "$RUNNER_TEMP/aligned.apk"
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/radio-world-auto-release.jks" --ks-pass pass:temporary-release-password --key-pass pass:temporary-release-password --ks-key-alias radio-world-auto --out "$GITHUB_WORKSPACE/radio-world-auto-release.apk" "$RUNNER_TEMP/aligned.apk"
          "$APKSIGNER" verify --verbose "$GITHUB_WORKSPACE/radio-world-auto-release.apk"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: radio-world-auto-release
          path: radio-world-auto-release.apk
          if-no-files-found: error
