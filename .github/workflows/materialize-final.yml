name: Materialize Automotive Final

on:
  push:
    branches:
      - feature/automotive-final

permissions:
  contents: write

jobs:
  materialize:
    if: "!contains(github.event.head_commit.message, '[materialize-final]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Apply exact patch chain
        run: |
          python3 android/tools/fix_emoji_compat.py
          python3 scripts/apply_player_metadata_ui_patch.py
          python3 tools/fix_metadata.py
          python3 tools/fix_ui_stability.py
          python3 tools/apply_minimal_automotive_ui.py

      - name: Remove build-time patch execution
        working-directory: android
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle.kts")
          s = p.read_text()
          start = s.index('\ntasks.register<org.gradle.api.tasks.Exec>("fixEmojiCompat")')
          end = s.index('\ndependencies {', start)
          s = s[:start] + '\n' + s[end:]
          p.write_text(s)
          PY

      - name: Verify no patch tasks remain
        run: |
          ! grep -q 'fixEmojiCompat\|applyPlayerMetadataUiPatch\|applyFinalMetadataFix\|applyUiStabilityFix\|applyMinimalAutomotiveUi' android/app/build.gradle.kts
          grep -q 'private fun switchToNextStation' android/app/src/main/java/com/mellefresh13/radio/MainActivity.kt
          grep -q 'marginStart = dp(30)' android/app/src/main/java/com/mellefresh13/radio/MainActivity.kt

      - name: Build without patches
        working-directory: android
        run: |
          gradle :app:assembleRelease

      - name: Commit materialized source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/src/main/java/com/mellefresh13/radio/MainActivity.kt android/app/build.gradle.kts
          git commit -m "build: materialize automotive final [materialize-final]"
          git push
