name: Android Release APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-release.yml"
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease

      - name: Generate temporary release key
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/radio-world-auto-release.jks" \
            -storepass "temporary-release-password" \
            -keypass "temporary-release-password" \
            -alias radio-world-auto \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Radio World Auto, OU=Mobile, O=mellefresh13-tech, L=, ST=, C=BY"

      - name: Align and sign release APK
        shell: bash
        run: |
          set -euo pipefail
          APK="${GITHUB_WORKSPACE}/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          if [ ! -f "$APK" ]; then
            APK="$(find "${GITHUB_WORKSPACE}/android/app/build/outputs/apk/release" -maxdepth 1 -name '*.apk' -print -quit)"
          fi
          test -n "$APK" && test -f "$APK"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -name zipalign | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
          "$ZIPALIGN" -f -p 4 "$APK" "${RUNNER_TEMP}/aligned.apk"
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/radio-world-auto-release.jks" \
            --ks-pass pass:temporary-release-password \
            --key-pass pass:temporary-release-password \
            --ks-key-alias radio-world-auto \
            --out "${GITHUB_WORKSPACE}/radio-world-auto-release.apk" \
            "${RUNNER_TEMP}/aligned.apk"
          "$APKSIGNER" verify --verbose "${GITHUB_WORKSPACE}/radio-world-auto-release.apk"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: radio-world-auto-release
          path: radio-world-auto-release.apk
          if-no-files-found: error
