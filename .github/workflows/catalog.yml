name: Catalog snapshot

on:
  push:
    paths:
      - "collector/**"
      - "api/**"
      - ".github/workflows/catalog.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

concurrency:
  group: catalog-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-catalog:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install collector
        run: pip install -r collector/requirements.txt

      - name: Build merged candidate snapshot
        env:
          PYTHONPATH: collector/src
        run: python -m radio_catalog.cli --output data/generated/canonical-candidate.json

      - name: Build SQLite database
        env:
          PYTHONPATH: api/src
        run: |
          python -m radio_api.importer \
            data/generated/canonical-candidate.json \
            data/generated/radio.db

      - name: Validate SQLite database
        env:
          PYTHONPATH: api/src
        run: |
          python - <<'PY'
          import sqlite3

          connection = sqlite3.connect("data/generated/radio.db")
          stations = connection.execute("SELECT COUNT(*) FROM stations").fetchone()[0]
          online_streams = connection.execute(
              "SELECT COUNT(*) FROM streams WHERE status = 'online'"
          ).fetchone()[0]
          connection.close()

          if stations <= 0:
              raise SystemExit("catalog database contains no stations")

          print(f"stations={stations} online_streams={online_streams}")
          PY

      - name: Publish current database to catalog-data branch
        run: |
          cp data/generated/radio.db /tmp/radio.db

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git switch --orphan catalog-data-next
          git rm -rf . || true

          mkdir -p data
          cp /tmp/radio.db data/radio.db

          git add -f data/radio.db
          git commit -m "chore(catalog): update generated database"
          git push origin HEAD:catalog-data --force

      - name: Upload catalog artifact
        uses: actions/upload-artifact@v4
        with:
          name: radio-world-catalog
          path: |
            data/generated/canonical-candidate.json
            data/generated/coverage.json
            data/generated/radio.db
          retention-days: 7
