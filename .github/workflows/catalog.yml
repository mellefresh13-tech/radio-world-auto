# Delta semantic version ordering fix 1790920205942
name: Catalog snapshot
# Semantic delta: volatile verification timestamps are excluded from station change detection.

# Catalog refresh is intentionally manual-only.
on:
  workflow_dispatch:
    inputs:
      allow_catalog_shrink:
        description: "Allow an intentional catalog drop greater than 25% after reviewing the candidate"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "17 */6 * * *"

concurrency:
  group: catalog-${{ github.ref }}
  cancel-in-progress: true

# The catalog build processes public remote data and third-party Python packages;
# it must not receive a write-capable repository token.
permissions:
  contents: read

jobs:
  build-catalog:
    # Never publish generated catalog data from a feature/refactor branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install collector
        run: pip install -r collector/requirements.txt

      - name: Build merged candidate snapshot
        env:
          PYTHONPATH: collector/src
        run: python -m radio_catalog.cli --output data/generated/canonical-candidate.json

      - name: Validate generated JSON catalog
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/generated/canonical-candidate.json")
          if path.stat().st_size > 64 * 1024 * 1024:
              raise SystemExit("generated catalog exceeds the 64 MiB client limit")
          data = json.loads(path.read_text(encoding="utf-8"))
          if not isinstance(data, list) or not data or len(data) > 50_000:
              raise SystemExit("generated catalog must contain 1..50000 stations")
          names = {str(item.get("name", "")).strip().casefold() for item in data if isinstance(item, dict)}
          required_names = {"radio zet", "новое радио"}
          missing = required_names - names
          if missing:
              raise SystemExit(f"generated catalog is missing required curated station names: {sorted(missing)}")
          print(f"generated_stations={len(data)} curated_checks=ok")
          PY

      - name: Build SQLite database
        env:
          PYTHONPATH: api/src
        run: |
          python -m radio_api.importer \
            data/generated/canonical-candidate.json \
            data/generated/radio.db

      - name: Validate SQLite database
        env:
          PYTHONPATH: api/src
        run: |
          python - <<'PY'
          import sqlite3

          connection = sqlite3.connect("data/generated/radio.db")
          stations = connection.execute("SELECT COUNT(*) FROM stations").fetchone()[0]
          online_streams = connection.execute(
              "SELECT COUNT(*) FROM streams WHERE status = 'online'"
          ).fetchone()[0]
          connection.close()

          if stations <= 0:
              raise SystemExit("catalog database contains no stations")
          if online_streams <= 0:
              raise SystemExit("catalog database contains no online streams")

          print(f"stations={stations} online_streams={online_streams}")
          PY

      - name: Fetch previous catalog for delta calculation
        run: |
          git fetch origin catalog-data:refs/remotes/origin/catalog-data || true
          if git show origin/catalog-data:data/catalog-manifest.json > data/generated/previous-catalog-manifest.json 2>/dev/null; then
            echo "Previous catalog manifest captured"
          else
            rm -f data/generated/previous-catalog-manifest.json
            echo "Previous catalog manifest is unavailable; shrink guard will fail unless explicitly bypassed"
          fi

      - name: Build catalog manifest and delta
        run: python tools/build_catalog_delta.py

      - name: Check catalog shrink before uploading artifacts
        env:
          ALLOW_CATALOG_SHRINK: ${{ inputs.allow_catalog_shrink || false }}
        run: |
          python tools/check_catalog_shrink.py \
            data/generated/catalog-manifest.json \
            data/generated/previous-catalog-manifest.json

      - name: Build catalog debug snapshot
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: python tools/build_catalog_debug.py

      - name: Prepare catalog publication bundle
        run: |
          set -euo pipefail
          mkdir -p publication/data publication/debug
          cp data/generated/radio.db publication/data/radio.db
          cp data/generated/canonical-candidate.json publication/data/stations.json
          cp data/generated/catalog-manifest.json publication/data/catalog-manifest.json
          cp data/generated/catalog-delta.json publication/data/catalog-delta.json
          cp -R data/generated/debug/. publication/debug/
          cp debug/index.html publication/debug/index.html
          touch publication/.nojekyll

      - name: Upload catalog publication bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: radio-world-catalog-publication
          path: publication/
          include-hidden-files: true
          retention-days: 1

      - name: Upload catalog artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: radio-world-catalog
          path: |
            data/generated/canonical-candidate.json
            data/generated/coverage.json
            data/generated/radio.db
            data/generated/catalog-manifest.json
            data/generated/catalog-delta.json
          retention-days: 7

  publish-catalog:
    name: Publish validated catalog snapshot
    needs: build-catalog
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Only this small job has a write-capable token. It does not install packages
    # or execute collector/importer/debug-generation code.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch previous published manifest
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin catalog-data:refs/remotes/origin/catalog-data || true
          if git show origin/catalog-data:data/catalog-manifest.json > previous-catalog-manifest.json 2>/dev/null; then
            echo "Previous published manifest captured"
          else
            rm -f previous-catalog-manifest.json
            echo "Previous published manifest is unavailable; publication guard will fail unless explicitly bypassed"
          fi

      - name: Download catalog publication bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: radio-world-catalog-publication
          path: publication

      - name: Check catalog shrink before publication
        env:
          ALLOW_CATALOG_SHRINK: ${{ inputs.allow_catalog_shrink || false }}
        run: |
          python tools/check_catalog_shrink.py \
            publication/data/catalog-manifest.json \
            previous-catalog-manifest.json

      - name: Publish bundle to catalog-data branch
        shell: bash
        run: |
          set -euo pipefail
          test -f publication/.nojekyll
          test -s publication/data/radio.db
          test -s publication/data/stations.json
          test -s publication/data/catalog-manifest.json
          test -s publication/data/catalog-delta.json
          test -s publication/debug/index.html

          # Re-validate the artifact in the write-enabled job, independently of the builder.
          python - <<'PY'
          import json
          import sqlite3
          from pathlib import Path

          manifest_path = Path("publication/data/catalog-manifest.json")
          if manifest_path.stat().st_size > 10 * 1024 * 1024:
              raise SystemExit("catalog-manifest.json exceeds the 10 MiB publication limit")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          if (
              not isinstance(manifest, dict)
              or not isinstance(manifest.get("version"), str)
              or not manifest["version"].strip()
              or not isinstance(manifest.get("station_count"), int)
              or manifest["station_count"] <= 0
          ):
              raise SystemExit("catalog-manifest.json has an invalid structure")

          # Refuse publishing a candidate that loses more than 25% of the
          # previously published stations. First publication has no baseline.
          import subprocess
          previous_manifest_result = subprocess.run(
              ["git", "show", "origin/catalog-data:data/catalog-manifest.json"],
              check=False,
              capture_output=True,
              text=True,
          )
          if previous_manifest_result.returncode == 0:
              try:
                  previous_manifest = json.loads(previous_manifest_result.stdout)
                  previous_count = previous_manifest.get("station_count")
              except (json.JSONDecodeError, AttributeError):
                  previous_count = None
              if isinstance(previous_count, int) and previous_count > 0:
                  minimum_allowed = previous_count * 0.75
                  if manifest["station_count"] < minimum_allowed:
                      raise SystemExit(
                          "catalog shrink guard failed: "
                          f"candidate has {manifest['station_count']} stations; "
                          f"previous catalog has {previous_count}; "
                          "decrease exceeds 25%"
                      )

          delta_path = Path("publication/data/catalog-delta.json")
          if delta_path.stat().st_size > 64 * 1024 * 1024:
              raise SystemExit("catalog-delta.json exceeds the 64 MiB client limit")
          delta = json.loads(delta_path.read_text(encoding="utf-8"))
          if (
              not isinstance(delta, dict)
              or not isinstance(delta.get("version"), str)
              or not delta["version"].strip()
              or not isinstance(delta.get("updated"), list)
              or not isinstance(delta.get("removed_ids"), list)
          ):
              raise SystemExit("catalog-delta.json has an invalid structure")

          stations_path = Path("publication/data/stations.json")
          if stations_path.stat().st_size > 64 * 1024 * 1024:
              raise SystemExit("stations.json exceeds the 64 MiB client limit")
          stations = json.loads(stations_path.read_text(encoding="utf-8"))
          if not isinstance(stations, list) or not stations or len(stations) > 50_000:
              raise SystemExit("stations.json must be a non-empty list of at most 50000 stations")
          if any(
              not isinstance(item, dict)
              or not isinstance(item.get("id"), str)
              or not item["id"].strip()
              or not isinstance(item.get("name"), str)
              or not item["name"].strip()
              for item in stations
          ):
              raise SystemExit("stations.json contains an entry without a non-empty string id and name")

          database = Path("publication/data/radio.db")
          if database.stat().st_size > 256 * 1024 * 1024:
              raise SystemExit("radio.db exceeds the 256 MiB publication limit")
          with sqlite3.connect(database) as connection:
              integrity = connection.execute("PRAGMA integrity_check").fetchone()[0]
              if integrity != "ok":
                  raise SystemExit(f"radio.db failed integrity_check: {integrity}")
              station_count = connection.execute("SELECT COUNT(*) FROM stations").fetchone()[0]
              online_stream_count = connection.execute(
                  "SELECT COUNT(*) FROM streams WHERE status = 'online'"
              ).fetchone()[0]
              if station_count <= 0 or online_stream_count <= 0:
                  raise SystemExit("radio.db must contain stations and online streams")
          print(
              f"publication_validation=ok json_stations={len(stations)} "
              f"db_stations={station_count} online_streams={online_stream_count}"
          )
          PY

          # Keep the downloaded artifact outside the checkout while switching to
          # an orphan snapshot branch, then copy only the expected publication tree.
          cp -R publication /tmp/radio-world-catalog-publication

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan catalog-data-next
          git rm -rf . || true
          cp -R /tmp/radio-world-catalog-publication/. .

          git add -f .nojekyll data/radio.db data/stations.json data/catalog-manifest.json data/catalog-delta.json debug
          git commit -m "chore(catalog): update generated catalog"
          git push origin HEAD:catalog-data --force
