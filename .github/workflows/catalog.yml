name: Catalog snapshot

on:
  push:
    paths:
      - "collector/**"
      - ".github/workflows/catalog.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

concurrency:
  group: catalog-main
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-catalog:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install collector
        run: pip install -r collector/requirements.txt

      - name: Build merged candidate snapshot
        env:
          PYTHONPATH: collector/src
        run: python -m radio_catalog.cli --output data/generated/canonical-candidate.json

      - name: Build SQLite database
        env:
          PYTHONPATH: api/src
        run: |
          python -m radio_api.importer             data/generated/canonical-candidate.json             data/generated/radio.db

      - name: Validate SQLite database
        env:
          PYTHONPATH: api/src
        run: |
          python - <<'PY'
          import sqlite3
          connection = sqlite3.connect("data/generated/radio.db")
          stations = connection.execute("SELECT COUNT(*) FROM stations").fetchone()[0]
          online_streams = connection.execute(
              "SELECT COUNT(*) FROM streams WHERE status = 'online'"
          ).fetchone()[0]
          connection.close()
          if stations <= 0:
              raise SystemExit("catalog database contains no stations")
          print(f"stations={stations} online_streams={online_streams}")
          PY

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Prepare Docker image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-api
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and publish API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Upload catalog artifact
        uses: actions/upload-artifact@v4
        with:
          name: radio-world-catalog
          path: |
            data/generated/canonical-candidate.json
            data/generated/coverage.json
            data/generated/radio.db
          retention-days: 7
