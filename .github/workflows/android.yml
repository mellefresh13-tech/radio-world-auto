name: Android Release APK

# APK builds are intentionally manual-only.
on:
  workflow_dispatch:

concurrency:
  group: android-release-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release:
    # Signing secrets are only exposed on the two explicitly supported build refs.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: "9.6.0"

      - name: Run unit tests
        run: gradle :app:test

      - name: Run Android lint
        continue-on-error: true
        run: gradle :app:lintRelease

      - name: Upload Android lint report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-lint-report
          path: android/app/build/reports/lint-results-release.*
          if-no-files-found: warn

      - name: Build release APK
        run: gradle :app:assembleRelease

      - name: Prepare release signing key
        id: signing
        working-directory: .
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${ANDROID_KEYSTORE_BASE64:-}" ]]; then
            if [[ -z "${ANDROID_KEYSTORE_PASSWORD:-}" || -z "${ANDROID_KEY_ALIAS:-}" || -z "${ANDROID_KEY_PASSWORD:-}" ]]; then
              echo "::error::The persistent keystore is set, but one or more required signing secrets are missing."
              exit 1
            fi
            echo "Using persistent Android release signing key."
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/radio-world-auto-release.jks"
            echo "SIGNING_KEYSTORE=$RUNNER_TEMP/radio-world-auto-release.jks" >> "$GITHUB_ENV"
            echo "SIGNING_STOREPASS=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "SIGNING_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "SIGNING_KEYPASS=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "signing_mode=persistent" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Persistent signing secrets are not configured. This APK is a test build and cannot update an install signed with another key."
            TEMP_SIGNING_PASSWORD="$(openssl rand -hex 32)"
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/radio-world-auto-release.jks" -storepass "$TEMP_SIGNING_PASSWORD" -keypass "$TEMP_SIGNING_PASSWORD" -alias radio-world-auto -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Radio World Auto, OU=Mobile, O=domanovsky, L=, ST=, C=BY"
            echo "SIGNING_KEYSTORE=$RUNNER_TEMP/radio-world-auto-release.jks" >> "$GITHUB_ENV"
            echo "SIGNING_STOREPASS=$TEMP_SIGNING_PASSWORD" >> "$GITHUB_ENV"
            echo "SIGNING_ALIAS=radio-world-auto" >> "$GITHUB_ENV"
            echo "SIGNING_KEYPASS=$TEMP_SIGNING_PASSWORD" >> "$GITHUB_ENV"
            echo "signing_mode=temporary" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify persistent signing certificate fingerprint
        if: steps.signing.outputs.signing_mode == 'persistent'
        env:
          # The signing values were exported via GITHUB_ENV by the previous step.
          EXPECTED_SIGNING_CERT_SHA256: ${{ secrets.ANDROID_SIGNING_CERT_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_SIGNING_CERT_SHA256="$(
            keytool -exportcert \
              -keystore "$SIGNING_KEYSTORE" \
              -storepass "$SIGNING_STOREPASS" \
              -alias "$SIGNING_ALIAS" |
              sha256sum | awk '{print tolower($1)}'
          )"
          echo "Persistent signing certificate SHA-256: $ACTUAL_SIGNING_CERT_SHA256"

          EXPECTED_SIGNING_CERT_SHA256="$(
            printf '%s' "${EXPECTED_SIGNING_CERT_SHA256:-}" |
              tr -d ':[:space:]' |
              tr '[:upper:]' '[:lower:]'
          )"
          if [[ -z "$EXPECTED_SIGNING_CERT_SHA256" ]]; then
            echo "::error::ANDROID_SIGNING_CERT_SHA256 is required when using the persistent release signing key."
            exit 1
          fi
          if [[ ! "$EXPECTED_SIGNING_CERT_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::ANDROID_SIGNING_CERT_SHA256 must contain a SHA-256 fingerprint (64 hex characters, colons optional)."
            exit 1
          fi
          if [[ "$ACTUAL_SIGNING_CERT_SHA256" != "$EXPECTED_SIGNING_CERT_SHA256" ]]; then
            echo "::error::The persistent signing certificate does not match ANDROID_SIGNING_CERT_SHA256."
            exit 1
          fi
          echo "Persistent signing certificate fingerprint matches the configured expected value."

      - name: Align and sign release APK
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$APK"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -name zipalign | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
          test -n "$ZIPALIGN" && test -n "$APKSIGNER"
          "$ZIPALIGN" -f -p 4 "$APK" "$RUNNER_TEMP/aligned.apk"
          "$APKSIGNER" sign --ks "$SIGNING_KEYSTORE" --ks-pass "env:SIGNING_STOREPASS" --key-pass "env:SIGNING_KEYPASS" --ks-key-alias "$SIGNING_ALIAS" --out "$GITHUB_WORKSPACE/radio-world-auto-release.apk" "$RUNNER_TEMP/aligned.apk"
          "$APKSIGNER" verify --verbose "$GITHUB_WORKSPACE/radio-world-auto-release.apk"

      - name: Upload release APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.signing.outputs.signing_mode == 'persistent' && 'radio-world-auto-release' || 'radio-world-auto-test-build' }}
          path: radio-world-auto-release.apk
          if-no-files-found: error
