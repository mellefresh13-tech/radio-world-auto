name: Android Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "feature/settings-screen-2026-10-19"
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

concurrency:
  group: android-release-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release:
    # Signing secrets are only exposed on the two explicitly supported build refs.
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/settings-screen-2026-10-19'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Run unit tests
        run: gradle :app:test

      - name: Run Android lint
        continue-on-error: true
        run: gradle :app:lintRelease

      - name: Upload Android lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report
          path: android/app/build/reports/lint-results-release.*
          if-no-files-found: warn

      - name: Build release APK
        run: gradle :app:assembleRelease

      - name: Prepare release signing key
        id: signing
        working-directory: .
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${ANDROID_KEYSTORE_BASE64:-}" ]]; then
            if [[ -z "${ANDROID_KEYSTORE_PASSWORD:-}" || -z "${ANDROID_KEY_ALIAS:-}" || -z "${ANDROID_KEY_PASSWORD:-}" ]]; then
              echo "::error::The persistent keystore is set, but one or more required signing secrets are missing."
              exit 1
            fi
            echo "Using persistent Android release signing key."
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/radio-world-auto-release.jks"
            echo "SIGNING_KEYSTORE=$RUNNER_TEMP/radio-world-auto-release.jks" >> "$GITHUB_ENV"
            echo "SIGNING_STOREPASS=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "SIGNING_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "SIGNING_KEYPASS=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "signing_mode=persistent" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Persistent signing secrets are not configured. This APK is a test build and cannot update an install signed with another key."
            TEMP_SIGNING_PASSWORD="$(openssl rand -hex 32)"
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/radio-world-auto-release.jks" -storepass "$TEMP_SIGNING_PASSWORD" -keypass "$TEMP_SIGNING_PASSWORD" -alias radio-world-auto -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Radio World Auto, OU=Mobile, O=domanovsky, L=, ST=, C=BY"
            echo "SIGNING_KEYSTORE=$RUNNER_TEMP/radio-world-auto-release.jks" >> "$GITHUB_ENV"
            echo "SIGNING_STOREPASS=$TEMP_SIGNING_PASSWORD" >> "$GITHUB_ENV"
            echo "SIGNING_ALIAS=radio-world-auto" >> "$GITHUB_ENV"
            echo "SIGNING_KEYPASS=$TEMP_SIGNING_PASSWORD" >> "$GITHUB_ENV"
            echo "signing_mode=temporary" >> "$GITHUB_OUTPUT"
          fi

      - name: Align and sign release APK
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$APK"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -name zipalign | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
          test -n "$ZIPALIGN" && test -n "$APKSIGNER"
          "$ZIPALIGN" -f -p 4 "$APK" "$RUNNER_TEMP/aligned.apk"
          "$APKSIGNER" sign --ks "$SIGNING_KEYSTORE" --ks-pass "pass:$SIGNING_STOREPASS" --key-pass "pass:$SIGNING_KEYPASS" --ks-key-alias "$SIGNING_ALIAS" --out "$GITHUB_WORKSPACE/radio-world-auto-release.apk" "$RUNNER_TEMP/aligned.apk"
          "$APKSIGNER" verify --verbose "$GITHUB_WORKSPACE/radio-world-auto-release.apk"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.signing.outputs.signing_mode == 'persistent' && 'radio-world-auto-release' || 'radio-world-auto-test-build' }}
          path: radio-world-auto-release.apk
          if-no-files-found: error
