<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Radio World Auto — Catalog Debug</title>
<style>
:root{color-scheme:dark;--bg:#0d1117;--p:#161b22;--p2:#21262d;--b:#30363d;--t:#e6edf3;--m:#8b949e;--a:#58a6ff;--g:#3fb950;--r:#f85149;--w:#d29922}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}main{max-width:1500px;margin:auto;padding:24px}h1{font-size:28px;margin:0 0 4px}h2{font-size:19px;margin:28px 0 10px}.muted{color:var(--m)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:10px}.card,.panel{background:var(--p);border:1px solid var(--b);border-radius:12px}.card{padding:14px}.label{color:var(--m);font-size:12px}.value{font-size:22px;font-weight:700;margin-top:3px}.pos{color:var(--g)}.neg{color:var(--r)}.warn{color:var(--w)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.toolbar input,.toolbar select,.toolbar button{background:var(--p);border:1px solid var(--b);color:var(--t);padding:9px 11px;border-radius:8px}.toolbar input{flex:1;min-width:220px}.toolbar button{cursor:pointer}.tabs{display:flex;gap:6px}.tabs button.active{border-color:var(--a);color:var(--a)}.list{max-height:620px;overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:9px 10px;border-bottom:1px solid var(--b);text-align:left}th{position:sticky;top:0;background:var(--p2)}.num{text-align:right}.station{padding:10px 12px;border-bottom:1px solid var(--b)}.station b{display:block}.meta{color:var(--m);font-size:12px}.station details{margin-top:6px}pre{white-space:pre-wrap;background:#0b0f14;padding:10px;border-radius:8px;overflow:auto}.err{padding:14px;border:1px solid var(--r);border-radius:10px;margin-top:10px}@media(max-width:700px){main{padding:14px}}
</style></head><body><main>
<h1>Radio World Auto — Catalog Debug</h1><div id="status" class="muted">Загрузка…</div><div id="error"></div>
<h2>Сводка</h2><div id="cards" class="grid"></div>
<h2>Страны</h2><div class="toolbar"><input id="countryQ" placeholder="Поиск страны или кода"><select id="countrySort"><option value="current">Сейчас</option><option value="delta">Δ</option><option value="removed">Удалено</option><option value="added">Добавлено</option><option value="alpha">А-Я</option></select></div><div class="panel list"><table><thead><tr><th>Страна</th><th class="num">Было</th><th class="num">Сейчас</th><th class="num">Δ</th><th class="num">+</th><th class="num">−</th></tr></thead><tbody id="countries"></tbody></table></div>
<h2>Delta</h2><div class="toolbar tabs"><button class="active" data-tab="added">Добавлены</button><button data-tab="removed">Удалены</button><button data-tab="changed">Изменены</button></div><div class="toolbar"><input id="deltaQ" placeholder="Поиск станции, города, страны"></div><div id="delta" class="panel list"></div>
<h2>Текущий плейлист</h2><div class="toolbar"><select id="countrySelect"></select><input id="stationQ" placeholder="Поиск станции"></div><div id="stations" class="panel list"></div>
<h2>Диагностика</h2><div id="diag" class="grid"></div>
</main>
<script>
const v=Date.now();let summary,delta,stations=[],tab="added";
const esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=x=>new Intl.NumberFormat("ru-RU").format(x??0),sgn=x=>x>0?"+"+x:String(x);
const text=x=>[x.name,x.country,x.city,x.id,...(x.genres||[]),...(x.languages||[])].join(" ").toLowerCase();
const cname=c=>{try{return new Intl.DisplayNames(["ru"],{type:"region"}).of(c)||c}catch{return c}};
const flag=c=>/^[A-Z]{2}$/.test(c)?String.fromCodePoint(...c.split("").map(x=>0x1F1E6+x.charCodeAt(0)-65)):"🌐";
async function init(){try{const [a,b,c]=await Promise.all([fetch("summary.json?v="+v),fetch("delta.json?v="+v),fetch("../data/stations.json?v="+v)]);if(!a.ok||!b.ok||!c.ok)throw Error("Не удалось загрузить debug snapshot");summary=await a.json();delta=await b.json();stations=await c.json();render();document.querySelector("#status").textContent="Последнее обновление: "+new Intl.DateTimeFormat("ru-RU",{dateStyle:"medium",timeStyle:"medium"}).format(new Date(summary.generated_at))+" • версия "+summary.version}catch(e){document.querySelector("#status").textContent="Ошибка";document.querySelector("#error").innerHTML='<div class="err">'+esc(e.message)+'</div>'}}
function render(){let d=summary.station_delta||0;document.querySelector("#cards").innerHTML=[["Последнее обновление",new Intl.DateTimeFormat("ru-RU",{dateStyle:"medium",timeStyle:"short"}).format(new Date(summary.generated_at))],["Сейчас",fmt(summary.station_count)],["Было",fmt(summary.previous_station_count)],["Δ станций",sgn(d),d>0?"pos":d<0?"neg":""],["Добавлено",fmt(summary.added_count),"pos"],["Удалено",fmt(summary.removed_count),"neg"],["Изменено",fmt(summary.changed_count)],["Стран",fmt(summary.country_count)]].map(x=>'<div class="card"><div class="label">'+x[0]+'</div><div class="value '+(x[2]||"")+'">'+x[1]+'</div></div>').join("");countryRender();deltaRender();selectRender();stationsRender();diagRender()}
function countryRender(){let q=document.querySelector("#countryQ").value.toLowerCase(),m=document.querySelector("#countrySort").value,r=(summary.countries||[]).filter(x=>cname(x.code).toLowerCase().includes(q)||x.code.toLowerCase().includes(q));r.sort((a,b)=>m==="alpha"?cname(a.code).localeCompare(cname(b.code),"ru"):m==="delta"?(b.delta-a.delta):m==="removed"?(b.removed-a.removed):m==="added"?(b.added-a.added):(b.after-a.after));document.querySelector("#countries").innerHTML=r.map(x=>'<tr><td>'+flag(x.code)+" "+esc(cname(x.code))+' <span class="muted">('+x.code+")</span>"+(x.limit_reached?' <b class="warn">500</b>':"")+'</td><td class="num">'+fmt(x.before)+'</td><td class="num">'+fmt(x.after)+'</td><td class="num '+(x.delta>0?"pos":x.delta<0?"neg":"")+'">'+sgn(x.delta)+'</td><td class="num pos">+'+fmt(x.added)+'</td><td class="num neg">−'+fmt(x.removed)+"</td></tr>").join("")}
function deltaRender(){let q=document.querySelector("#deltaQ").value.toLowerCase(),items=(delta[tab]||[]);items=items.filter(x=>tab==="changed"?text(x.after||{}).includes(q)||text(x.before||{}).includes(q):(text(x).includes(q)));document.querySelector("#delta").innerHTML=items.map(x=>tab==="changed"?'<div class="station"><b>'+esc(x.name)+'</b><div class="meta">'+(x.changed_fields||[]).join(", ")+'</div><details><summary>До / после</summary><pre>'+esc(JSON.stringify({before:x.before,after:x.after},null,2))+"</pre></details></div>":'<div class="station"><b>'+esc(x.name)+'</b><div class="meta">'+flag(x.country)+" "+esc(cname(x.country))+" • "+esc(x.city||"")+" • "+esc(x.id)+'</div><details><summary>Данные</summary><pre>'+esc(JSON.stringify(x,null,2))+"</pre></details></div>").join("")||'<div class="station muted">Ничего не найдено.</div>'}
function selectRender(){let s=document.querySelector("#countrySelect"),old=s.value;s.innerHTML=(summary.countries||[]).filter(x=>x.after>0).sort((a,b)=>b.after-a.after).map(x=>'<option value="'+x.code+'">'+esc(cname(x.code))+" ("+x.after+")</option>").join("");if(old)s.value=old}
function stationsRender(){let code=document.querySelector("#countrySelect").value,q=document.querySelector("#stationQ").value.toLowerCase(),r=stations.filter(x=>x.country===code&&text(x).includes(q)).sort((a,b)=>String(a.name).localeCompare(String(b.name),"ru"));document.querySelector("#stations").innerHTML=r.map(x=>'<div class="station"><b>'+esc(x.name)+'</b><div class="meta">'+esc(x.city||"")+" • "+esc((x.genres||[]).join(", "))+" • "+esc((x.languages||[]).join(", "))+'</div><div class="meta">'+esc(x.id)+" • streams: "+(x.streams||[]).length+"</div></div>").join("")||'<div class="station muted">Ничего не найдено.</div>'}
function diagRender(){let s=summary.current?.streams||{},p=summary.previous?.streams||{};document.querySelector("#diag").innerHTML=[["Online streams",fmt(s.online_streams)],["Всего streams",fmt(s.total_streams)],["Стран с лимитом 500",fmt(summary.limited_country_count)],["Unknown / ZZ",fmt((summary.countries||[]).find(x=>x.code==="ZZ")?.after||0)],["Источник станций",Object.entries(summary.current?.sources||{}).map(x=>x[0]+": "+x[1]).join(" • ")||"—"],["Жанров",fmt(Object.keys(summary.current?.genres||{}).length)],["Предыдущее обновление",summary.previous_generated_at?new Intl.DateTimeFormat("ru-RU",{dateStyle:"medium",timeStyle:"short"}).format(new Date(summary.previous_generated_at)):"—"],["Streams было",fmt(p.total_streams)]].map(x=>'<div class="card"><div class="label">'+x[0]+'</div><div class="value">'+x[1]+"</div></div>").join("")}
document.querySelector("#countryQ").oninput=countryRender;document.querySelector("#countrySort").onchange=countryRender;document.querySelector("#deltaQ").oninput=deltaRender;document.querySelector("#countrySelect").onchange=stationsRender;document.querySelector("#stationQ").oninput=stationsRender;document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-tab]").forEach(x=>x.classList.remove("active"));b.classList.add("active");tab=b.dataset.tab;deltaRender()});init();
</script></body></html>
